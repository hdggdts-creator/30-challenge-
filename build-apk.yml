name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build web app
        run: |
          npm install
          npm run build

      - name: Prepare Capacitor
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "30 Challenge" com.hdggdtscreator.challenge --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 30-challenge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
