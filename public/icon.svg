<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E1E2E"/>
      <stop offset="60%" stop-color="#0E0E18"/>
      <stop offset="100%" stop-color="#07070B"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#F5D77A"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA7C11"/>
      <stop offset="50%" stop-color="#F5D77A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- Safe Zone Circular Border for Maskable Icons -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldRing)" stroke-width="4" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 8" stroke-opacity="0.6"/>

  <!-- Geometric 8-point Islamic Star subtle background -->
  <g opacity="0.12" fill="none" stroke="url(#goldGrad)" stroke-width="3" transform="translate(256, 240)">
    <rect x="-100" y="-100" width="200" height="200"/>
    <rect x="-100" y="-100" width="200" height="200" transform="rotate(45)"/>
  </g>

  <!-- Central "30" Emblem -->
  <g filter="url(#goldGlow)">
    <!-- Number 30 -->
    <text x="256" y="275" 
          font-family="'Reem Kufi', 'Cairo', system-ui, sans-serif" 
          font-size="160" 
          font-weight="900" 
          fill="url(#goldGrad)" 
          text-anchor="middle" 
          dominant-baseline="central">
      30
    </text>

    <!-- Subtitle: تحدي الثلاثين -->
    <text x="256" y="365" 
          font-family="'Reem Kufi', 'Cairo', system-ui, sans-serif" 
          font-size="34" 
          font-weight="700" 
          fill="url(#goldGrad)" 
          letter-spacing="1" 
          text-anchor="middle">
      تحدي الثلاثين
    </text>

    <!-- Cultural Crown / Star on top -->
    <path d="M 256 100 L 262 118 L 280 118 L 266 128 L 271 146 L 256 135 L 241 146 L 246 128 L 232 118 L 250 118 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
