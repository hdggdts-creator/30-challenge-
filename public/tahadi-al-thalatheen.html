<!DOCTYPE html>
<html lang="ar" dir="rtl" data-mode="dark" data-accent="gold">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تحدي الثلاثين - النسخة الثقافية والمعلومات العامة</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#07070B" id="metaThemeColor">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="تحدي 30">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">

  <!-- Immediate Theme Initializer to Prevent Flash of Unstyled Theme -->
  <script>
    (function() {
      try {
        var mode = localStorage.getItem('tahadi_color_mode') || 'dark';
        var accent = localStorage.getItem('tahadi_accent_color') || 'gold';
        var legacy = localStorage.getItem('tahadi_theme');
        if (legacy) {
          if (['gold', 'royal-blue', 'emerald'].indexOf(legacy) !== -1) accent = legacy;
          if (legacy === 'auto') mode = 'auto';
        }
        var resolvedMode = mode;
        if (mode === 'auto') {
          resolvedMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-mode', resolvedMode);
        document.documentElement.setAttribute('data-accent', accent);
        var meta = document.getElementById('metaThemeColor');
        if (meta) {
          meta.setAttribute('content', resolvedMode === 'light' ? '#FBF7EC' : '#07070B');
        }
      } catch(e) {}
    })();
  </script>

  <!-- Google Fonts: Cairo (Questions & Body) + Reem Kufi (Titles & Display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Reem+Kufi:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ========================================================
       Theme Definitions via CSS Variables on :root, data-mode, data-accent
       ======================================================== */
    :root, [data-mode="dark"] {
      --font-question: "Cairo", "Tajawal", system-ui, -apple-system, "Segoe UI", sans-serif;
      --bg-dark: #07070B;
      --page-bg: #07070B;
      --bg-surface: #0E0E16;
      --bg-card: rgba(18, 18, 26, 0.85);
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --timer-track: rgba(255, 255, 255, 0.1);
      --pattern-opacity: 0.035;
      --theme-meta: #07070B;
    }

    [data-mode="light"] {
      --font-question: "Cairo", "Tajawal", system-ui, -apple-system, "Segoe UI", sans-serif;
      --bg-dark: #FBF7EC;
      --page-bg: linear-gradient(135deg, #FBF7EC 0%, #F6EEDB 50%, #EFE4CC 100%);
      --bg-surface: #FFFFFF;
      --bg-card: rgba(255, 255, 255, 0.9);
      --text-main: #1E293B;
      --text-muted: #64748B;
      --timer-track: rgba(0, 0, 0, 0.08);
      --pattern-opacity: 0.045;
      --theme-meta: #FBF7EC;
    }

    [data-accent="gold"] {
      --accent-primary: #D4AF37;
      --accent-light: #F5D77A;
      --accent-dark: #B8902B;
      --border-accent: rgba(212, 175, 55, 0.3);
      --glow-accent: rgba(212, 175, 55, 0.35);
      --pattern-color: %23D4AF37;
    }
    [data-mode="light"][data-accent="gold"] {
      --accent-primary: #B8860B;
      --accent-light: #8C6200;
      --accent-dark: #664400;
      --border-accent: rgba(184, 134, 11, 0.3);
      --glow-accent: rgba(184, 134, 11, 0.2);
    }

    [data-accent="royal-blue"] {
      --accent-primary: #6C8CFF;
      --accent-light: #C9D6FF;
      --accent-dark: #3B62E0;
      --border-accent: rgba(108, 140, 255, 0.3);
      --glow-accent: rgba(108, 140, 255, 0.4);
      --pattern-color: %236C8CFF;
    }
    [data-mode="light"][data-accent="royal-blue"] {
      --accent-primary: #2563EB;
      --accent-light: #1D4ED8;
      --accent-dark: #1E40AF;
      --border-accent: rgba(37, 99, 235, 0.3);
      --glow-accent: rgba(37, 99, 235, 0.2);
    }

    [data-accent="emerald"] {
      --accent-primary: #2ECC9A;
      --accent-light: #E8D48B;
      --accent-dark: #1B8E68;
      --border-accent: rgba(46, 204, 154, 0.3);
      --glow-accent: rgba(46, 204, 154, 0.4);
      --pattern-color: %232ECC9A;
    }
    [data-mode="light"][data-accent="emerald"] {
      --accent-primary: #059669;
      --accent-light: #047857;
      --accent-dark: #065F46;
      --border-accent: rgba(5, 150, 105, 0.3);
      --glow-accent: rgba(5, 150, 105, 0.2);
    }

    body {
      background: var(--page-bg);
      background-color: var(--bg-dark);
      color: var(--text-main);
      color: var(--text-main);
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
      position: relative;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    h1, h2, h3, .font-display {
      font-family: 'Reem Kufi', 'Cairo', sans-serif;
    }

    /* Typography specific to Questions, Answers, and Hints */
    .question-card {
      font-family: var(--font-question);
    }
    .question-text {
      font-family: var(--font-question);
      font-weight: 700;
      line-height: 1.8;
      font-size: clamp(1.25rem, 2.2vw + 0.8rem, 2.4rem);
      text-wrap: balance;
      letter-spacing: 0;
      color: var(--text-main);
    }
    .answer-text {
      font-family: var(--font-question);
      font-weight: 800;
      letter-spacing: 0;
      color: var(--accent-light);
    }
    .hint-text {
      font-family: var(--font-question);
      font-weight: 600;
      letter-spacing: 0;
      font-size: 0.95em;
    }

    /* Subtle Islamic Geometric Pattern with Dynamic Variable */
    .bg-pattern {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23D4AF37' fill-rule='evenodd'%3E%3Cpath d='M40 0l10 10-10 10-10-10L40 0zm0 40l10 10-10 10-10-10L40 40zm-20-20l10 10-10 10-10-10L20 20zm40 0l10 10-10 10-10-10L60 20zM0 0h20v20H0V0zm60 0h20v20H60V0zM0 60h20v20H0V60zm60 0h20v20H60V60z'/%3E%3C/g%3E%3C/svg%3E");
      z-index: 0;
      transition: opacity 0.4s ease;
    }

    .accent-gradient-text {
      background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent-primary) 50%, var(--accent-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .glass-box {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-accent);
      border-radius: 20px;
      transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .accent-glow {
      box-shadow: 0 0 25px -5px var(--glow-accent);
    }
    .accent-glow-lg {
      box-shadow: 0 0 45px -5px var(--glow-accent);
    }

    /* Buttons */
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      outline: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    button:active {
      transform: scale(0.97);
    }
    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-accent {
      background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent-primary) 50%, var(--accent-dark) 100%);
      color: #07070B;
      font-weight: 800;
      border-radius: 14px;
      padding: 14px 28px;
      font-size: 1.1rem;
      box-shadow: 0 4px 20px var(--glow-accent);
    }
    .btn-accent:hover {
      filter: brightness(1.1);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-accent);
      color: var(--text-main);
      border-radius: 14px;
      padding: 12px 24px;
      font-weight: 600;
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-primary);
    }

    .btn-success {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: #FFFFFF;
      font-weight: 800;
      border-radius: 16px;
      padding: 16px;
      font-size: 1.1rem;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
    }
    .btn-danger {
      background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
      color: #FFFFFF;
      font-weight: 800;
      border-radius: 16px;
      padding: 16px;
      font-size: 1.1rem;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3);
    }

    /* Container Layout */
    .container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    @keyframes pulseUrgent {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }
    .urgent-timer {
      animation: pulseUrgent 0.6s infinite ease-in-out;
    }

    /* Flame Glow Animations for Streak */
    @keyframes flamePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px #F59E0B); }
      50% { transform: scale(1.18); filter: drop-shadow(0 0 14px #EF4444); }
    }
    .flame-active {
      display: inline-block;
      animation: flamePulse 1s infinite ease-in-out;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.84);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      width: 100%;
      max-width: 540px;
      background: var(--bg-surface);
      border: 1px solid var(--border-accent);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    /* Circular Lifeline Button */
    .lifeline-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid var(--border-accent);
      color: var(--accent-light);
      position: relative;
      transition: all 0.25s ease;
    }
    .lifeline-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-primary);
      box-shadow: 0 0 15px var(--glow-accent);
      transform: translateY(-2px);
    }
    .lifeline-btn.used {
      opacity: 0.35;
      background: rgba(0,0,0,0.4);
      border-color: rgba(255,255,255,0.1);
      color: #64748B;
      cursor: not-allowed;
    }

    /* Theme Switcher Badges */
    .theme-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .theme-dot:hover {
      transform: scale(1.15);
    }
    .theme-dot.active {
      outline: 2px solid #FFF;
      outline-offset: 2px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: var(--border-accent); border-radius: 9999px; }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>
  <canvas id="confettiCanvas" style="position:fixed; inset:0; pointer-events:none; z-index:90;"></canvas>

  <div class="container" id="app">

  </div>

  <footer style="position:relative; z-index:10; padding:12px; text-align:center; font-size:12px; color:var(--text-muted); border-top:1px solid var(--border-accent); display:flex; justify-content:space-between; align-items:center; max-width:960px; margin:0 auto; width:100%;">
    <span>تحدي الثلاثين © 2026 - النسخة الثقافية والمعلومات العامة</span>
    <div style="display:flex; align-items:center; gap:8px;">
      <span id="pwaOfflineBadge" style="display:none; padding:2px 8px; border-radius:6px; font-size:10px; font-weight:700; background:rgba(16,185,129,0.15); color:#34D399; border:1px solid rgba(16,185,129,0.3);">

  <script>
    // ==========================================

    const TARGET_WIN_SCORE = 30; // حد الفوز بالنقاط

    const BET_POINTS = 2; // نقاط الرهان (+2 للصح و -2 للخطأ)

    // ==========================================

      { id: 'h3', category: 'تاريخ', difficulty: 'easy', question: 'ما هي الحضارة التي شيدت أهرامات الجيزة الخالدة؟', answer: 'الحضارة المصرية القديمة (الفراعنة)', hint: 'قامت على ضفاف نهر النيل' },

      { id: 'h11', category: 'تاريخ', difficulty: 'hard', question: 'ما هي الدولة الآسيوية التي يعود إليها فضل اختراع الورق والبارود والبوصلة والطباعة بالقوالب؟', answer: 'الصين', hint: 'حضارة سور الصين العظيم' },
      { id: 'h12', category: 'تاريخ', difficulty: 'easy', question: 'ما هو اللقب الملكي الذي كان يحمله حكام مصر القديمة؟', answer: 'فرعون', hint: 'لُقّب به رمسيس وتحوتمس وإخناتون' },
      { id: 'h13', category: 'تاريخ', difficulty: 'medium', question: 'في أي قرن ميلادي اندلعت الثورة الفرنسية وسقط سجن الباستيل (1789م)؟', answer: 'القرن الثامن عشر', hint: 'بين عامي 1700 و1799' },
      { id: 'h14', category: 'تاريخ', difficulty: 'hard', question: 'ما هو الاسم التاريخي لشبكة الطرق البرية التجارية التي ربطت الصين بأوروبا؟', answer: 'طريق الحرير', hint: 'سُمي باسم المنسوج الفاخر' },
      { id: 'h15', category: 'تاريخ', difficulty: 'hard', question: 'من هو الرحالة العربي الملقب بـ "أمير الرحالين" صاحب كتاب "تحفة النظار"؟', answer: 'ابن بطوطة', hint: 'ولد في طنجة بالمغرب في القرن 14' },

      // --- جغرافيا (15) ---
      { id: 'g1', category: 'جغرافيا', difficulty: 'easy', question: 'ما هو أطول نهر في العالم وفي قارة إفريقيا؟', answer: 'نهر النيل', hint: 'يمر بمصر والسودان ويصب في البحر المتوسط' },
      { id: 'g2', category: 'جغرافيا', difficulty: 'easy', question: 'ما هي أكبر قارة في العالم من حيث المساحة وعدد السكان؟', answer: 'آسيا', hint: 'تضم الصين وروسيا والهند' },
      { id: 'g3', category: 'جغرافيا', difficulty: 'easy', question: 'ما هي عاصمة سلطنة عُمان؟', answer: 'مسقط', hint: 'مدينة ساحلية عريقة تطل على بحر عُمان' },
      { id: 'g4', category: 'جغرافيا', difficulty: 'medium', question: 'ما هو أكبر محيطات الكرة الأرضية من حيث المساحة؟', answer: 'المحيط الهادئ', hint: 'يغطي أكثر من ثلث مساحة كوكب الأرض' },
      { id: 'g5', category: 'جغرافيا', difficulty: 'medium', question: 'ما هي أعلى قمة جبلية على سطح الكرة الأرضية؟', answer: 'قمة إفرست', hint: 'تقع في سلسلة جبال الهيمالايا' },
      { id: 'g6', category: 'جغرافيا', difficulty: 'medium', question: 'ما هي أصغر دولة ذات سيادة في العالم من حيث المساحة؟', answer: 'الفاتيكان', hint: 'تقع بالكامل داخل العاصمة الإيطالية روما' },
      { id: 'g7', category: 'جغرافيا', difficulty: 'medium', question: 'ما هو المضيق المائي الذي يفصل بين القارة الإفريقية وشبه الجزيرة الإيبيرية؟', answer: 'مضيق جبل طارق', hint: 'يربط البحر المتوسط بالمحيط الأطلسي' },
      { id: 'g8', category: 'جغرافيا', difficulty: 'medium', question: 'ما هي الدولة العربية التي تقع جزرها بالكامل في المحيط الهندي؟', answer: 'جزر القمر', hint: 'عاصمتها موروني' },
      { id: 'g9', category: 'جغرافيا', difficulty: 'hard', question: 'ما هو أكبر مسطح مائي داخلي ومغلق (بحيرة حبيسة) في العالم مساحةً؟', answer: 'بحر قزوين', hint: 'تطل عليه خمس دول منها إيران وروسيا' },

    // 3) نظام الصوتيات الإجرائي (Web Audio API)
    // ==========================================
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.muted = false;
        try {
          const m = localStorage.getItem('tahadi_sound_muted');
          if (m !== null) this.muted = JSON.parse(m);
        } catch(e) {}
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      toggleMute() {
        this.muted = !this.muted;
        try { localStorage.setItem('tahadi_sound_muted', JSON.stringify(this.muted)); } catch(e) {}
        return this.muted;
      }
      playClick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.05);
        g.gain.setValueAtTime(0.08, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
      }
      playCorrect() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
          g.gain.setValueAtTime(0, this.ctx.currentTime + idx * 0.08);
          g.gain.linearRampToValueAtTime(0.12, this.ctx.currentTime + idx * 0.08 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.35);
          osc.connect(g);
          g.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.08);
          osc.stop(this.ctx.currentTime + idx * 0.08 + 0.36);
        });
      }
      playWrong() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.3);
        g.gain.setValueAtTime(0.12, this.ctx.currentTime);
        g.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.35);
      }
      playTick(urgent = false) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = urgent ? 'sawtooth' : 'triangle';
        osc.frequency.setValueAtTime(urgent ? 880 : 520, this.ctx.currentTime);
        g.gain.setValueAtTime(urgent ? 0.07 : 0.04, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.04);
      }
      playTimeout() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        [196, 185, 174].forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(f, this.ctx.currentTime + idx * 0.12);
          g.gain.setValueAtTime(0.12, this.ctx.currentTime + idx * 0.12);
          g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.12 + 0.2);
          osc.connect(g);
          g.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.12);
          osc.stop(this.ctx.currentTime + idx * 0.12 + 0.22);
        });
      }
      playVictory() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const notes = [
          { f: 523.25, d: 0.15 }, { f: 659.25, d: 0.15 },
          { f: 783.99, d: 0.15 }, { f: 1046.50, d: 0.4 },
          { f: 880.00, d: 0.2 }, { f: 1046.50, d: 0.6 }
        ];
        let t = this.ctx.currentTime;
        notes.forEach(n => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(n.f, t);
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.15, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, t + n.d);
          osc.connect(g);
          g.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + n.d + 0.05);
          t += n.d;
        });
      }
      playStreakBonus() {
        if (this.muted) return;

        if (!this.ctx) return;

          osc.connect(g);

          osc.stop(this.ctx.currentTime + i * 0.07 + 0.42);

        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.28);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.28);
      }
    }

    // Load saved theme

      if (!['gold', 'royal-blue', 'emerald'].includes(t)) return;

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // Helper: calculate first letter clue
    function calculateFirstLetterClue(answer) {
      const clean = answer.replace(/[()]/g, '').trim();
      const firstLetter = clean.match(/[ء-ي]/)?.[0] || clean[0];
      const letterCount = clean.replace(/[^ء-ي]/g, '').length;
      let blanks = '';
      for (let i = 1; i < letterCount; i++) {
        blanks += ' _';
      }
      return `${firstLetter}${blanks} — (${letterCount} حروف)`;
    }

    // ==========================================
    // 5) التحكم بالمؤقت بدقة Date.now()
    // ==========================================
    function stopTimer() {
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
    }

    function startTimer(duration) {
      stopTimer();
      state.timeRemaining = duration;
      state.timerRemainingAtStart = duration;
      state.timerStart = Date.now();
      state.lastTickSec = Math.ceil(duration);

      state.timerInterval = setInterval(() => {
        if (state.isPaused || state.consultTimer.active) return;
        const elapsed = (Date.now() - state.timerStart) / 1000;
        const rem = Math.max(0, state.timerRemainingAtStart - elapsed);
        state.timeRemaining = rem;

        const ceilVal = Math.ceil(rem);
        if (ceilVal < state.lastTickSec && ceilVal > 0) {
          state.lastTickSec = ceilVal;
          if (ceilVal <= 5) audio.playTick(true);
          else if (ceilVal <= 10) audio.playTick(false);
        }

        updateTimerDisplay();

        if (rem <= 0) {
          stopTimer();
          audio.playTimeout();
          updateTimerDisplay();
        }
      }, 50);
    }

    function pauseTimer() {
      if (state.isPaused) return;
      state.isPaused = true;
      const elapsed = (Date.now() - state.timerStart) / 1000;
      state.timerRemainingAtStart = Math.max(0, state.timerRemainingAtStart - elapsed);
      state.timeRemaining = state.timerRemainingAtStart;
    }

    function resumeTimer() {
      if (!state.isPaused) return;
      state.isPaused = false;
      state.timerStart = Date.now();
      state.lastTickSec = Math.ceil(state.timerRemainingAtStart);
    }

    // Add 15 extra seconds (Lifeline 2)
    function addExtraTime() {
      const active = state.activeTeamIndex === 0 ? state.team1 : state.team2;
      if (active.lifelines.extraTime || state.questionLifelineUsed || state.answerRevealed || state.isPaused) return;

      audio.playClick();
      active.lifelines.extraTime = true;
      state.questionLifelineUsed = true;

      // Add 15 seconds, max 45s
      const newRem = Math.min(45, state.timeRemaining + 15);
      state.timeRemaining = newRem;
      state.timerRemainingAtStart = newRem;
      state.timerStart = Date.now();
      state.lastTickSec = Math.ceil(newRem);

      renderPlay();
    }

    // First Letter Lifeline (Lifeline 1)
    function revealFirstLetter() {
      const active = state.activeTeamIndex === 0 ? state.team1 : state.team2;
      if (active.lifelines.firstLetter || state.questionLifelineUsed || state.answerRevealed || state.isPaused) return;

      const q = state.questions[state.currentIndex];
      if (!q) return;

      audio.playClick();
      active.lifelines.firstLetter = true;
      state.questionLifelineUsed = true;
      state.firstLetterClue = calculateFirstLetterClue(q.answer);

      renderPlay();
    }

    // Consult Friend Lifeline (Lifeline 3)
    function startConsultFriend() {
      const active = state.activeTeamIndex === 0 ? state.team1 : state.team2;
      if (active.lifelines.consultFriend || state.questionLifelineUsed || state.answerRevealed || state.isPaused) return;

      audio.playClick();
      active.lifelines.consultFriend = true;
      state.questionLifelineUsed = true;

      // Pause main timer accurately
      const elapsed = (Date.now() - state.timerStart) / 1000;
      state.timerRemainingAtStart = Math.max(0, state.timerRemainingAtStart - elapsed);
      state.timeRemaining = state.timerRemainingAtStart;

      // Open consultation modal & start 20s consultation timer
      state.consultTimer.active = true;
      state.consultTimer.secondsLeft = 20;

      showConsultModal();

      state.consultTimer.intervalId = setInterval(() => {
        state.consultTimer.secondsLeft -= 1;
        const el = document.getElementById('consultSecText');
        if (el) el.innerText = state.consultTimer.secondsLeft;

        if (state.consultTimer.secondsLeft <= 0) {
          endConsultFriend();
        }
      }, 1000);
    }

    function endConsultFriend() {
      if (state.consultTimer.intervalId) {
        clearInterval(state.consultTimer.intervalId);
        state.consultTimer.intervalId = null;
      }
      state.consultTimer.active = false;
      const modal = document.getElementById('consultModal');
      if (modal) modal.remove();

      // Resume main timer
      state.timerStart = Date.now();
      state.lastTickSec = Math.ceil(state.timerRemainingAtStart);
      renderPlay();
    }

    // ==========================================
    // 6) احتفال الفوز بـ Canvas Confetti
    // ==========================================
    let confettiCancel = null;
    function runConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const computed = getComputedStyle(document.documentElement);
      const primaryColor = computed.getPropertyValue('--accent-primary').trim() || '#D4AF37';
      const lightColor = computed.getPropertyValue('--accent-light').trim() || '#F5D77A';
      const colors = [primaryColor, lightColor, '#FFFFFF', '#38BDF8', '#10B981', '#F59E0B'];

      for (let i = 0; i < 160; i++) {
        particles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 320,
          y: canvas.height * 0.4 + (Math.random() - 0.5) * 160,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 16,
          vy: Math.random() * -14 - 4,
          rot: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 10,
          opacity: 1
        });
      }

      let animId;
      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.22;
          p.vx *= 0.985;
          p.rot += p.vRot;
          if (p.y > canvas.height * 0.8) p.opacity -= 0.015;
          if (p.opacity <= 0 || p.y > canvas.height + 20) {
            particles.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.globalAlpha = Math.max(0, p.opacity);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size * 0.6);
          ctx.restore();
        }
        if (particles.length > 0) animId = requestAnimationFrame(loop);
      }
      animId = requestAnimationFrame(loop);
      confettiCancel = () => {
        cancelAnimationFrame(animId);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      };
    }

                  const active = state.selectedDifficulty === d;
                  return `
                    <button onclick="audio.playClick(); state.selectedDifficulty='${d}'; renderSetup();"
                      style="padding:8px; border-radius:8px; font-size:13px; font-weight:700; ${active ? 'background:linear-gradient(135deg, var(--accent-light), var(--accent-primary)); color:#07070B;' : 'background:rgba(255,255,255,0.04); color:var(--text-muted); border:1px solid rgba(255,255,255,0.08);'}">
                      ${lbl}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <div style="margin-bottom:28px;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <label style="font-size:13px; font-weight:700; color:#E2E8F0;">
                  اختيار التصنيفات (${state.selectedCategories.length} من 10 مختارة - الأدنى 3):
                </label>
                <div style="display:flex; gap:12px; font-size:12px;">
                  <span style="color:var(--accent-light); cursor:pointer;" onclick="selectRandomCat();">عشوائي (5)</span>
                  <span style="color:var(--accent-light); cursor:pointer;" onclick="selectAllCat();">تحديد الكل</span>
                </div>
              </div>

              <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px;">
                ${ALL_CATEGORIES.map(cat => {
                  const sel = state.selectedCategories.includes(cat);
                  return `
                    <button onclick="toggleCat('${cat}');"
                      style="padding:10px; border-radius:12px; text-align:center; font-size:13px; font-weight:600; border:1px solid ${sel ? 'var(--accent-primary)' : 'rgba(255,255,255,0.06)'}; ${sel ? 'background:rgba(255,255,255,0.12); color:#FFF; box-shadow:0 0 15px var(--glow-accent);' : 'background:rgba(0,0,0,0.3); color:var(--text-muted);'}">
                      ${cat}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <div style="display:flex; justify-content:flex-end;">
              <button class="btn-accent font-display" onclick="startNewGame();" ${state.selectedCategories.length < 3 ? 'disabled' : ''}>
                دخول حلبة التحدي
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function toggleCat(cat) {
      audio.playClick();
      if (state.selectedCategories.includes(cat)) {
        if (state.selectedCategories.length <= 3) return;
        state.selectedCategories = state.selectedCategories.filter(c => c !== cat);
      } else {
        state.selectedCategories.push(cat);
      }
      renderSetup();
    }

    function selectRandomCat() {
      audio.playClick();
      state.selectedCategories = shuffle(ALL_CATEGORIES).slice(0, 5);
      renderSetup();
    }

    function selectAllCat() {
      audio.playClick();
      state.selectedCategories = [...ALL_CATEGORIES];
      renderSetup();
    }

    function startNewGame() {
      const t1 = document.getElementById('team1Input')?.value?.trim();
      const t2 = document.getElementById('team2Input')?.value?.trim();
      state.team1 = { 
        name: t1 || 'الفريق الأول', 
        score: 0, 
        correct: 0, 
        streak: 0, 
        longestStreak: 0, 
        lifelines: { firstLetter: false, extraTime: false, consultFriend: false }, 
        betsLeft: 2, 
        skips: 0 
      };
      state.team2 = { 
        name: t2 || 'الفريق الثاني', 
        score: 0, 
        correct: 0, 
        streak: 0, 
        longestStreak: 0, 
        lifelines: { firstLetter: false, extraTime: false, consultFriend: false }, 
        betsLeft: 2, 
        skips: 0 
      };

      let pool = QUESTIONS_BANK.filter(q => state.selectedCategories.includes(q.category));
      if (state.selectedDifficulty !== 'all') {
        const filtered = pool.filter(q => q.difficulty === state.selectedDifficulty);
        if (filtered.length > 0) pool = filtered;
      }
      state.questions = shuffle(pool);
      state.currentIndex = 0;
      state.activeTeamIndex = 0;
      state.answerRevealed = false;
      state.isPaused = false;
      state.isProcessing = false;
      state.isTieBreaker = false;
      state.streakAlert = null;

      audio.playClick();
      state.screen = 'PLAY';
      checkBeforeQuestionStart();
    }

    // Checking if Betting Phase should open before Question starts
    function checkBeforeQuestionStart() {
      state.isCurrentQuestionBet = false;
      state.questionLifelineUsed = false;
      state.firstLetterClue = '';
      state.answerRevealed = false;

      const activeTeam = state.activeTeamIndex === 0 ? state.team1 : state.team2;
      const q = state.questions[state.currentIndex];
      if (!q) {
        state.screen = 'VICTORY';
        render();
        return;
      }

      // If team has >= 2 points and has bets left, offer Betting Round decision
      if (activeTeam.score >= 2 && activeTeam.betsLeft > 0) {
        state.isBettingPhase = true;
        render();
      } else {
        state.isBettingPhase = false;
        render();
        startTimer(QUESTION_TIMER_SECONDS);
      }
    }

    function confirmBetDecision(isBet) {
      audio.playClick();
      const activeTeam = state.activeTeamIndex === 0 ? state.team1 : state.team2;

      if (isBet && activeTeam.score >= 2 && activeTeam.betsLeft > 0) {
        activeTeam.betsLeft -= 1;
        state.isCurrentQuestionBet = true;
        audio.playBetFanfare();
      } else {
        state.isCurrentQuestionBet = false;
      }

      state.isBettingPhase = false;
      render();
      startTimer(QUESTION_TIMER_SECONDS);
    }

    // Helper: format flame streak indicator
    function renderStreakFlame(streak) {
      if (!streak || streak <= 0) return '';
      if (streak === 1) return `<span class="flame-active" title="سلسلة إجابات: 1">🔥</span>`;
      if (streak === 2) return `<span class="flame-active" title="سلسلة إجابات: 2">🔥🔥</span>`;
      return `<span class="flame-active" title="سلسلة ذهبية!">🔥🔥🔥</span>`;
    }

    // Helper: format remaining lifelines badge
    function renderLifelinesStatus(team) {
      let count = 0;
      if (!team.lifelines.firstLetter) count++;
      if (!team.lifelines.extraTime) count++;
      if (!team.lifelines.consultFriend) count++;
      return `${count} من 3 متاحة`;
    }

    // شاشة قرار الرهان قبل ظهور السؤال
    function renderBetDecisionScreen(q) {

            <div style="display:flex; flex-direction:column; gap:12px;">
              <button class="btn-accent font-display" onclick="confirmBetDecision(true);" aria-label="رهان مضاعف">
                🎯 رهان ×2 (+2 للصح / -2 للخطأ) [B]
              </button>
              <button class="btn-outline" onclick="confirmBetDecision(false);" aria-label="لعب عادي">
                لعب عادي (+1 للصح / 0 للخطأ)
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // Modal: استشارة صديق (20 ثانية)
    function showConsultModal() {
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.id = 'consultModal';
      modal.innerHTML = `
        <div class="modal-box" style="text-align:center; max-width:420px; border-color:var(--accent-primary);">
          <div style="width:70px; height:70px; margin:0 auto 14px; border-radius:50%; background:rgba(255,255,255,0.08); border:2px solid var(--accent-primary); display:flex; align-items:center; justify-content:center; font-size:30px;">
            📞
          </div>
          <h3 class="font-display" style="font-size:1.5rem; font-weight:800; color:#FFF; margin-bottom:6px;">استشارة صديق</h3>
          <p style="font-size:13px; color:var(--text-muted); margin-bottom:18px;">المؤقت الرئيسي متوقف. لديكم 20 ثانية للنقاش!</p>
          
          <div style="font-size:3rem; font-weight:900; font-family:'Reem Kufi', sans-serif; color:var(--accent-light); margin-bottom:24px;">
            <span id="consultSecText">20</span> <span style="font-size:1rem; font-family:'Cairo';">ثانية</span>
          </div>

          <button class="btn-accent" style="width:100%; font-size:14px; padding:12px;" onclick="endConsultFriend();">
            إنهاء الاستشارة ومواصلة السؤال
          </button>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function updateTimerDisplay() {
      const circle = document.getElementById('timerProgressCircle');
      const text = document.getElementById('timerText');
      const container = document.getElementById('timerContainer');
      if (!circle || !text) return;

      const rem = Math.max(0, state.timeRemaining);
      const prog = rem / QUESTION_TIMER_SECONDS;
      const circumference = 2 * Math.PI * 31; // ~194.78
      circle.style.strokeDashoffset = circumference * (1 - Math.min(1, prog));

      const ceilSec = Math.ceil(rem);
      text.innerText = ceilSec;

      const computed = getComputedStyle(document.documentElement);
      const primaryColor = computed.getPropertyValue('--accent-primary').trim() || '#D4AF37';

      if (rem > 10) {
        circle.style.stroke = primaryColor;
        text.style.color = 'var(--accent-light)';
        container?.classList.remove('urgent-timer');
      } else if (rem > 5) {
        circle.style.stroke = '#F97316';
        text.style.color = '#F97316';
        container?.classList.remove('urgent-timer');
      } else {
        circle.style.stroke = '#EF4444';
        text.style.color = '#EF4444';
        if (rem > 0) container?.classList.add('urgent-timer');
        else container?.classList.remove('urgent-timer');
      }
    }

    // الحكم على السؤال
    function judgeAnswer(isCorrect) {
      if (state.isProcessing || state.isBettingPhase) return;
      state.isProcessing = true;
      stopTimer();

      const active = state.activeTeamIndex === 0 ? state.team1 : state.team2;
      state.streakAlert = null;

      if (isCorrect) {
        audio.playCorrect();
        const earned = state.isCurrentQuestionBet ? BET_POINTS : 1;
        active.score += earned;
        active.correct += 1;

        // Streak logic
        active.streak += 1;
        if (active.streak > active.longestStreak) {
          active.longestStreak = active.streak;
        }

        // Streak Threshold Bonus (+1 bonus point at 3 streak)
        if (active.streak >= STREAK_THRESHOLD) {
          active.score += 1;
          active.streak = 0;
          state.streakAlert = `سلسلة ذهبية لـ ${active.name}! (+1 نقطة مكافأة)`;
          audio.playStreakBonus();
        }
      } else {
        audio.playWrong();
        // If wrong on Bet: subtract points (never below 0)
        if (state.isCurrentQuestionBet) {
          active.score = Math.max(0, active.score - BET_POINTS);
        }
        // Loss resets streak
        active.streak = 0;
      }

      setTimeout(() => {
        // Check game over
        if (state.team1.score >= TARGET_WIN_SCORE || state.team2.score >= TARGET_WIN_SCORE) {
          if (state.team1.score === state.team2.score) {
            state.isTieBreaker = true;
          } else {
            finishGame();
            return;
          }
        }

        const nextIdx = state.currentIndex + 1;
        if (nextIdx >= state.questions.length) {
          if (state.team1.score === state.team2.score) {
            state.isTieBreaker = true;
          } else {
            finishGame();
            return;
          }
        }

        state.currentIndex = nextIdx;
        state.activeTeamIndex = state.activeTeamIndex === 0 ? 1 : 0;
        state.isProcessing = false;

        // Prepare next turn with betting check
        checkBeforeQuestionStart();
      }, 650);
    }

    // Skip question (Refunds bet if skip used on bet question)
    function useSkip() {
      const active = state.activeTeamIndex === 0 ? state.team1 : state.team2;
      if (active.skips >= 2 || state.currentIndex + 1 >= state.questions.length || state.answerRevealed) return;

      audio.playClick();
      active.skips += 1;

      // If Bet was active, refund bet count without penalty!
      if (state.isCurrentQuestionBet) {
        active.betsLeft = Math.min(2, active.betsLeft + 1);
        state.isCurrentQuestionBet = false;
      }

      // Skip does not reset streak and does not increment it
      state.currentIndex += 1;
      state.questionLifelineUsed = false;
      state.firstLetterClue = '';
      state.answerRevealed = false;

      renderPlay();
      startTimer(QUESTION_TIMER_SECONDS);
    }

    function togglePauseGame() {
      audio.playClick();
      if (state.isPaused) {
        resumeTimer();
        renderPlay();
      } else {
        pauseTimer();
        showPauseModal();
      }
    }

    function finishGame() {
      stopTimer();
      audio.playVictory();
      state.screen = 'VICTORY';
      render();
      runConfetti();
    }

    // --- شاشة النتيجة والتتويج ---
    function renderVictory() {
      let winner = null;
      if (state.team1.score > state.team2.score) winner = state.team1;
      else if (state.team2.score > state.team1.score) winner = state.team2;

      appEl.innerHTML = `
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px 0;">
          <div class="glass-box accent-glow-lg" style="padding:36px; max-width:620px; width:100%; border-color:var(--accent-primary);">
            <div style="width:80px; height:80px; margin:0 auto 16px; border-radius:50%; background:rgba(255,255,255,0.08); border:1px solid var(--accent-primary); display:flex; align-items:center; justify-content:center; font-size:36px;">
              🏆
            </div>
            <span style="font-size:13px; font-weight:700; color:var(--accent-light); letter-spacing:2px; display:block; margin-bottom:8px;">
              بطل تحدي الثلاثين
            </span>
            <h2 class="accent-gradient-text font-display" style="font-size:clamp(2rem, 5vw, 3rem); font-weight:900; margin-bottom:24px;">
              ${winner ? `مبارك لـ ${winner.name}!` : 'تعادل بطولي بين الفريقين!'}
            </h2>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:28px;">
              <div style="background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:16px;">
                <span style="font-size:13px; color:var(--text-muted); display:block; margin-bottom:4px;">${state.team1.name}</span>
                <span class="font-display" style="font-size:3rem; font-weight:900; color:#FFF;">${state.team1.score}</span>
                <div style="font-size:11px; color:var(--text-muted); margin-top:8px; line-height:1.6;">
                  الإجابات الصحيحة: <strong>${state.team1.correct}</strong><br>
                  أطول سلسلة متتالية: <strong>${state.team1.longestStreak} 🔥</strong><br>
                  تخطي: ${state.team1.skips} · رهانات مستخدمة: ${2 - state.team1.betsLeft}
                </div>
              </div>

              <div style="background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:16px;">
                <span style="font-size:13px; color:var(--text-muted); display:block; margin-bottom:4px;">${state.team2.name}</span>
                <span class="font-display" style="font-size:3rem; font-weight:900; color:#FFF;">${state.team2.score}</span>
                <div style="font-size:11px; color:var(--text-muted); margin-top:8px; line-height:1.6;">
                  الإجابات الصحيحة: <strong>${state.team2.correct}</strong><br>
                  أطول سلسلة متتالية: <strong>${state.team2.longestStreak} 🔥</strong><br>
                  تخطي: ${state.team2.skips} · رهانات مستخدمة: ${2 - state.team2.betsLeft}
                </div>
              </div>
            </div>

            <div style="display:flex; flex-direction:column; gap:12px;">
              <button class="btn-accent font-display" onclick="audio.playClick(); startNewGame();">
                إعادة اللعب بنفس الإعدادات
              </button>
              <button class="btn-outline" onclick="audio.playClick(); state.screen='SPLASH'; render();">
                القائمة الرئيسية
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function showRulesModal() {
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal-box">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; border-bottom:1px solid var(--border-accent); padding-bottom:10px;">
            <h3 class="font-display" style="font-size:1.3rem; font-weight:700; color:#FFF;">قواعد تحدي الثلاثين المطوّرة</h3>
            <span style="font-size:20px; cursor:pointer;" onclick="this.closest('.modal-overlay').remove();">✕</span>
          </div>
          <div style="font-size:13px; line-height:1.8; color:#CBD5E1; max-height:60vh; overflow-y:auto; padding-right:4px;">
            <p><strong>1) المنافسة والفوز:</strong> فريقان يتناوبان على الأسئلة. أول من يحقق 30 نقطة يفوز فوراً.</p>
            <p><strong>2) وسائل المساعدة الثلاث:</strong> لكل فريق 3 وسائل (كل واحدة مرة واحدة فقط باللعبة):<br>
              • <strong>كشف الحرف الأول (1):</strong> يظهر الحرف الأول وعدد الحروف.<br>
              • <strong>وقت إضافي (2):</strong> يضيف 15 ثانية للمؤقت (بحد أقصى 45 ثانية).<br>
              • <strong>استشارة صديق (3):</strong> يوقف المؤقت ويمنح 20 ثانية للنقاش.<br>
              <em>(يُسمح بوسيلة واحدة فقط في السؤال الواحد).</em>
            </p>
            <p><strong>3) سلسلة الإجابات (Streak):</strong> كل 3 إجابات متتالية تمنح الفريق نقطة إضافية (+1) وتتوهج شعلة الحماس.</p>
            <p><strong>4) جولة الرهان:</strong> لكل فريق رهانان باللعبة. يظهر التصنيف قبل السؤال، إذا راهنت فالصح = +2 والخطأ = -2.</p>
            <p><strong>5) اختصارات لوحة المفاتيح:</strong> مسافة = إظهار الإجابة، Y = صح، N = خطأ، P = إيقاف، B = رهان، 1/2/3 = الوسائل.</p>
          </div>
          <div style="margin-top:20px; text-align:left;">
            <button class="btn-accent" style="padding:8px 20px; font-size:13px;" onclick="this.closest('.modal-overlay').remove();">
              فهمت، لنبدأ!
            </button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function showPauseModal() {
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.id = 'pauseModal';
      modal.innerHTML = `
        <div class="modal-box" style="text-align:center; max-width:400px;">
          <h3 class="font-display" style="font-size:1.5rem; font-weight:800; color:#FFF; margin-bottom:8px;">التحدي متوقف مؤقتاً</h3>
          <p style="font-size:13px; color:var(--text-muted); margin-bottom:24px;">المؤقت متوقف حالياً. هل ترغب في المتابعة؟</p>
          <div style="display:flex; flex-direction:column; gap:12px;">
            <button class="btn-accent" onclick="document.getElementById('pauseModal').remove(); resumeTimer(); renderPlay();">
              استئناف اللعب
            </button>
            <button class="btn-outline" onclick="document.getElementById('pauseModal').remove(); stopTimer(); state.screen='SPLASH'; render();">
              الخروج للقائمة الرئيسية
            </button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function confirmExitGame() {
      pauseTimer();
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.id = 'exitModal';
      modal.innerHTML = `
        <div class="modal-box" style="text-align:center; max-width:400px;">
          <h3 class="font-display" style="font-size:1.4rem; font-weight:800; color:#EF4444; margin-bottom:8px;">إنهاء التحدي الحالي؟</h3>
          <p style="font-size:13px; color:var(--text-muted); margin-bottom:20px;">سيتم إلغاء الجولة الحالية ولن يتم تتويج أي فريق.</p>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <button class="btn-outline" onclick="document.getElementById('exitModal').remove(); resumeTimer();">
              إلغاء ومتابعة
            </button>
            <button class="btn-danger" style="padding:10px; font-size:13px;" onclick="document.getElementById('exitModal').remove(); stopTimer(); state.screen='SPLASH'; render();">
              نعم، إنهاء
            </button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    // ==========================================
    // 8) اختصارات لوحة المفاتيح
    // ==========================================
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;

      // Betting phase shortcuts
      if (state.screen === 'PLAY' && state.isBettingPhase) {
        if (e.key === 'b' || e.key === 'B' || e.key === 'لا') {
          e.preventDefault();
          confirmBetDecision(true);
        } else if (e.code === 'Enter' || e.code === 'Space') {
          e.preventDefault();
          confirmBetDecision(false);
        }
        return;
      }

      if (state.screen !== 'PLAY') return;

      if (e.code === 'Space') {
        e.preventDefault();
        state.answerRevealed = !state.answerRevealed;
        audio.playClick();
        renderPlay();
      } else if (e.key === 'y' || e.key === 'Y' || e.key === 'غ') {
        e.preventDefault();
        judgeAnswer(true);
      } else if (e.key === 'n' || e.key === 'N' || e.key === 'ى') {
        e.preventDefault();
        judgeAnswer(false);
      } else if (e.key === 'p' || e.key === 'P' || e.key === 'ح') {
        e.preventDefault();
        togglePauseGame();
      } else if (e.key === '1') {
        e.preventDefault();
        revealFirstLetter();
      } else if (e.key === '2') {
        e.preventDefault();
        addExtraTime();
      } else if (e.key === '3') {
        e.preventDefault();
        startConsultFriend();
      }
    });

    // ==========================================
    // 9) PWA Integration & Install Handling
    // ==========================================
    let deferredInstallPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      renderPwaInstallButton();
    });

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      renderPwaInstallButton();
    });

    function renderPwaInstallButton() {
      const container = document.getElementById('pwaInstallContainer');
      const iosHint = document.getElementById('iosInstallHint');
      if (!container) return;

      // Check if running in standalone
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (isStandalone) {
        container.innerHTML = '';
        return;
      }

      // Check iOS
      const isIOS = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
      if (isIOS && iosHint && state.screen === 'SPLASH') {
        iosHint.style.display = 'block';
      }

      if (deferredInstallPrompt && state.screen === 'SPLASH') {
        container.innerHTML = `
          <button class="btn-accent" style="padding:6px 14px; font-size:12px; display:inline-flex; align-items:center; gap:6px;" onclick="triggerPwaInstall();" aria-label="تثبيت اللعبة">
            📲 تثبيت اللعبة
          </button>
        `;
      } else {
        container.innerHTML = '';
      }
    }

    async function triggerPwaInstall() {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      if (choice.outcome === 'accepted') {
        deferredInstallPrompt = null;
        renderPwaInstallButton();
      }
    }

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        try {
          navigator.serviceWorker.register('./sw.js')
            .then(() => {
              const badge = document.getElementById('pwaOfflineBadge');
              if (badge) badge.style.display = 'inline-block';
            })
            .catch(() => {});
        } catch(e) {}
      });
    }

    // بدء تشغيل الواجهة
    render();
  </script>
</body>
</html>
